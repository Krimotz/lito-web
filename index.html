<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiTo — Listen Together</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e10;
    --fg: #e8e8ea;
    --dim: #6a6a72;
    --line: #1e1e22;
    --accent: #f0b020;
    --error: #e05555;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  header {
    text-align: center;
    letter-spacing: 0.3em;
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
  }

  .hero {
    text-align: center;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
  }

  .hero-code {
    font-size: 44px;
    letter-spacing: 0.2em;
    color: var(--accent);
    line-height: 1;
  }

  .hero-label {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
  }

  .hero-status {
    font-size: 13px;
    color: var(--dim);
    min-height: 1.2em;
  }

  .hero-status.error { color: var(--error); }

  .hero-status.live {
    color: var(--accent);
  }

  .hero-status.live::before {
    content: "● ";
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  canvas#meter {
    width: 100%;
    height: 60px;
    display: block;
  }

  input#room {
    width: 100%;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg);
    font: inherit;
    font-size: 20px;
    letter-spacing: 0.2em;
    text-align: center;
    padding: 0.75rem;
    text-transform: lowercase;
  }

  input#room:focus {
    outline: none;
    border-color: var(--accent);
  }

  input#room::placeholder {
    color: #333338;
    letter-spacing: 0.2em;
  }

  input#room:disabled {
    opacity: 0.4;
  }

  button {
    width: 100%;
    background: transparent;
    border: 1px solid var(--fg);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.9rem;
    cursor: pointer;
    transition: background 120ms, color 120ms, border-color 120ms;
  }

  button:hover:not(:disabled) {
    background: var(--fg);
    color: var(--bg);
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  button.stop {
    border-color: var(--accent);
    color: var(--accent);
  }

  button.stop:hover:not(:disabled) {
    background: var(--accent);
    color: var(--bg);
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  #tapOverlay {
    position: fixed;
    inset: 0;
    background: rgba(14, 14, 16, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    cursor: pointer;
    z-index: 10;
  }

  #tapOverlay.visible { display: flex; }

  #tapOverlay .label {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }

  #tapOverlay .big {
    font-size: 20px;
    color: var(--fg);
  }
</style>
</head>
<body>

<main>
  <header>LiTo</header>

  <div class="hero">
    <div id="heroCode" class="hero-code">____</div>
    <div id="heroLabel" class="hero-label">room code</div>
    <div id="heroStatus" class="hero-status">idle</div>
  </div>

  <canvas id="meter" width="760" height="120"></canvas>

  <input
    id="room"
    type="text"
    placeholder="a4f9"
    autocomplete="off"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    maxlength="12"
  />

  <button id="toggleBtn">Listen</button>

  <footer>listen together</footer>
</main>

<div id="tapOverlay">
  <div class="label">audio is playing</div>
  <div class="big">tap anywhere to hear it</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// Configuration
// ═══════════════════════════════════════════════════════════════════

const SERVER_BASE = 'wss://lito-server.onrender.com';

// PCM format — must match AudioCaptureManager.kt on the Android side
const SAMPLE_RATE = 44100;
const CHANNELS = 2;

// Room ID scheme
const ROOM_PREFIX = 'lito';

// Auto-connect delay (ms) when the page loads with ?room=... in the URL.
const AUTOCONNECT_DELAY_MS = 800;

// Progressive cold-start messages: [elapsedMs, message]
const COLD_START_MESSAGES = [
  [0,     'connecting…'],
  [3000,  'waking server…'],
  [15000, 'still waking — first connect can take up to a minute'],
  [45000, 'this is taking longer than usual, still trying…'],
];

// ═══════════════════════════════════════════════════════════════════
// DOM references
// ═══════════════════════════════════════════════════════════════════

const heroCode = document.getElementById('heroCode');
const heroLabel = document.getElementById('heroLabel');
const heroStatus = document.getElementById('heroStatus');
const meterCanvas = document.getElementById('meter');
const meterCtx = meterCanvas.getContext('2d');
const roomInput = document.getElementById('room');
const toggleBtn = document.getElementById('toggleBtn');
const tapOverlay = document.getElementById('tapOverlay');

// ═══════════════════════════════════════════════════════════════════
// Room ID helpers
// ═══════════════════════════════════════════════════════════════════

function normalizeRoomCode(input) {
  if (!input) return null;
  const cleaned = String(input)
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
  if (!cleaned) return null;
  const code = cleaned.startsWith(ROOM_PREFIX)
    ? cleaned.slice(ROOM_PREFIX.length)
    : cleaned;
  return code || null;
}

function fullRoomId(code) {
  return ROOM_PREFIX + code;
}

// ═══════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════

let ws = null;
let audioCtx = null;
let nextPlayTime = 0;
let analyser = null;
let analyserData = null;
let meterRaf = null;
let coldStartTimer = null;
let isConnected = false;

// ═══════════════════════════════════════════════════════════════════
// UI helpers
// ═══════════════════════════════════════════════════════════════════

function setHeroCode(text) {
  heroCode.textContent = text;
}

function setHeroLabel(text) {
  heroLabel.textContent = text;
}

function setStatus(text, isError = false) {
  heroStatus.textContent = text;
  heroStatus.className = 'hero-status' +
    (isError ? ' error' : '') +
    (text === 'live' ? ' live' : '');
}

function setIdleUi() {
  isConnected = false;
  setHeroCode('____');
  setHeroLabel('room code');
  setStatus('idle');
  toggleBtn.textContent = 'Listen';
  toggleBtn.classList.remove('stop');
  toggleBtn.disabled = false;
  roomInput.disabled = false;
}

function setConnectedUi(code) {
  isConnected = true;
  setHeroCode(code);
  setHeroLabel('room');
  toggleBtn.textContent = 'Stop';
  toggleBtn.classList.add('stop');
  toggleBtn.disabled = false;
  roomInput.disabled = true;
}

// ═══════════════════════════════════════════════════════════════════
// Cold-start messaging
// ═══════════════════════════════════════════════════════════════════

function startColdStartMessages() {
  stopColdStartMessages();
  const start = Date.now();
  let index = 0;

  const tick = () => {
    const elapsed = Date.now() - start;
    while (
      index + 1 < COLD_START_MESSAGES.length &&
      elapsed >= COLD_START_MESSAGES[index + 1][0]
    ) {
      index++;
    }
    setStatus(COLD_START_MESSAGES[index][1]);
    coldStartTimer = setTimeout(tick, 500);
  };

  tick();
}

function stopColdStartMessages() {
  if (coldStartTimer) {
    clearTimeout(coldStartTimer);
    coldStartTimer = null;
  }
}

// ═══════════════════════════════════════════════════════════════════
// Connection lifecycle
// ═══════════════════════════════════════════════════════════════════

function connect() {
  const code = normalizeRoomCode(roomInput.value);
  if (!code) {
    setStatus('enter a room code', true);
    return;
  }

  setHeroCode(code);
  setHeroLabel('room');
  setStatus('connecting…');
  toggleBtn.textContent = 'Cancel';
  toggleBtn.classList.remove('stop');
  roomInput.disabled = true;

  // AudioContext must be created after a user gesture
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.2;
  analyserData = new Uint8Array(analyser.fftSize);
  analyser.connect(audioCtx.destination);

  nextPlayTime = audioCtx.currentTime + 0.1;

  ws = new WebSocket(`${SERVER_BASE}/listen/${fullRoomId(code)}`);
  ws.binaryType = 'arraybuffer';

  let confirmed = false;
  startColdStartMessages();

  ws.onopen = () => {
    setStatus('handshaking…');
  };

  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'joined') {
          confirmed = true;
          stopColdStartMessages();
          setConnectedUi(code);
          setStatus('waiting for audio…');
          startMeter();
          checkAutoplay();
        } else if (msg.type === 'error') {
          stopColdStartMessages();
          setStatus(msg.message, true);
          ws.close();
        }
      } catch (_) { /* ignore */ }
      return;
    }

    if (event.data instanceof ArrayBuffer) {
      if (!confirmed) {
        confirmed = true;
        stopColdStartMessages();
        setConnectedUi(code);
        startMeter();
      }
      setStatus('live');
      playPcm(event.data);
      checkAutoplay();
    }
  };

  ws.onerror = () => {
    stopColdStartMessages();
    setStatus('connection error', true);
  };

  ws.onclose = (event) => {
    stopColdStartMessages();
    if (!confirmed) {
      setStatus(`could not connect: ${event.reason || 'unknown'}`, true);
      setIdleUi();
    } else {
      disconnect(false);
    }
  };
}

function disconnect(closeSocket = true) {
  stopColdStartMessages();
  if (closeSocket && ws) {
    try { ws.close(); } catch (_) {}
  }
  ws = null;

  stopMeter();
  try { audioCtx?.close(); } catch (_) {}
  audioCtx = null;
  analyser = null;
  analyserData = null;
  nextPlayTime = 0;

  tapOverlay.classList.remove('visible');
  setIdleUi();
}

// ═══════════════════════════════════════════════════════════════════
// Autoplay handling
// ═══════════════════════════════════════════════════════════════════

function checkAutoplay() {
  if (audioCtx && audioCtx.state === 'suspended') {
    tapOverlay.classList.add('visible');
  } else {
    tapOverlay.classList.remove('visible');
  }
}

tapOverlay.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  tapOverlay.classList.remove('visible');
});

// ═══════════════════════════════════════════════════════════════════
// PCM playback
// ═══════════════════════════════════════════════════════════════════

function playPcm(arrayBuffer) {
  if (!audioCtx || !analyser) return;

  const int16 = new Int16Array(arrayBuffer);
  const frames = Math.floor(int16.length / CHANNELS);
  if (frames === 0) return;

  const buffer = audioCtx.createBuffer(CHANNELS, frames, SAMPLE_RATE);
  for (let ch = 0; ch < CHANNELS; ch++) {
    const channelData = buffer.getChannelData(ch);
    for (let i = 0; i < frames; i++) {
      channelData[i] = int16[i * CHANNELS + ch] / 32768;
    }
  }

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(analyser);

  const now = audioCtx.currentTime;
  if (nextPlayTime < now + 0.05) {
    nextPlayTime = now + 0.05;
  }
  source.start(nextPlayTime);
  nextPlayTime += buffer.duration;
}

// ═══════════════════════════════════════════════════════════════════
// Live frequency meter — single stroked line
// ═══════════════════════════════════════════════════════════════════

const METER_POINTS = 64;       // number of sample points along the line
const METER_LINE_WIDTH = 2;    // pixels

function startMeter() {
  if (meterRaf) return;

  const freqData = new Uint8Array(analyser.frequencyBinCount);

  // Frequency range: shifted upward to emphasize mids and highs
  const minFreq = 200;
  const maxFreq = 12000;
  const nyquist = audioCtx.sampleRate / 2;
  const binCount = analyser.frequencyBinCount;

  // Precompute logarithmic sample positions
  const sampleBins = [];
  for (let i = 0; i < METER_POINTS; i++) {
    const frac = i / (METER_POINTS - 1);
    const loHz = minFreq * Math.pow(maxFreq / minFreq, frac);
    const hiFrac = (i + 1) / (METER_POINTS - 1);
    const hiHz = minFreq * Math.pow(maxFreq / minFreq, hiFrac);

    const loBin = Math.max(0, Math.floor(loHz / nyquist * binCount));
    const hiBin = Math.min(binCount - 1, Math.floor(hiHz / nyquist * binCount));

    const centerHz = Math.sqrt(loHz * hiHz);
    const tilt = Math.pow(centerHz / minFreq, 0.25);

    sampleBins.push([loBin, Math.max(hiBin, loBin + 1), tilt]);
  }

  const displayValues = new Float32Array(METER_POINTS);

  const ATTACK = 0.85;
  const RELEASE = 0.25;
  const GAIN = 0.8;

  const draw = () => {
    if (!analyser) return;

    analyser.getByteFrequencyData(freqData);

    const w = meterCanvas.width;
    const h = meterCanvas.height;
    const centerY = h / 2;

    meterCtx.clearRect(0, 0, w, h);

    const accent = getComputedStyle(document.documentElement)
      .getPropertyValue('--accent').trim() || '#f0b020';
    meterCtx.strokeStyle = accent;
    meterCtx.lineWidth = METER_LINE_WIDTH;
    meterCtx.lineJoin = 'round';
    meterCtx.lineCap = 'round';

    // Compute smoothed values for every sample point
    for (let i = 0; i < METER_POINTS; i++) {
      const [loBin, hiBin, tilt] = sampleBins[i];

      let sum = 0;
      for (let b = loBin; b < hiBin; b++) {
        sum += freqData[b];
      }
      const avg = sum / (hiBin - loBin);
      const norm = avg / 255;

      const target = Math.min(1, Math.pow(norm, 0.8) * tilt * GAIN);

      const prev = displayValues[i];
      const factor = target > prev ? ATTACK : RELEASE;
      displayValues[i] = prev + (target - prev) * factor;
    }

    // Draw a single stroked line across the top edge
    meterCtx.beginPath();
    for (let i = 0; i < METER_POINTS; i++) {
      const x = (i / (METER_POINTS - 1)) * w;
      const y = centerY - displayValues[i] * (centerY - 4);
      if (i === 0) {
        meterCtx.moveTo(x, y);
      } else {
        meterCtx.lineTo(x, y);
      }
    }
    meterCtx.stroke();
  };

  const loop = () => {
    draw();
    meterRaf = requestAnimationFrame(loop);
  };

  loop();
}

function stopMeter() {
  if (meterRaf) {
    cancelAnimationFrame(meterRaf);
    meterRaf = null;
  }
  meterCtx.clearRect(0, 0, meterCanvas.width, meterCanvas.height);
}

// ═══════════════════════════════════════════════════════════════════
// Button handler — single toggle
// ═══════════════════════════════════════════════════════════════════

toggleBtn.addEventListener('click', () => {
  const label = toggleBtn.textContent.toLowerCase();
  if (label === 'listen' || label === 'retry') {
    connect();
  } else if (label === 'cancel' || label === 'stop') {
    disconnect();
  }
});

// ═══════════════════════════════════════════════════════════════════
// URL pre-fill and auto-connect
// ═══════════════════════════════════════════════════════════════════

const params = new URLSearchParams(location.search);
const presetCode = normalizeRoomCode(params.get('room'));

if (presetCode) {
  roomInput.value = presetCode;
  setHeroCode(presetCode);
  setHeroLabel('room');
  setStatus('connecting…');
  setTimeout(() => connect(), AUTOCONNECT_DELAY_MS);
} else {
  setIdleUi();
}

// Resize canvas to match device pixel ratio for crisp rendering
(function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = meterCanvas.getBoundingClientRect();
  meterCanvas.width = rect.width * dpr;
  meterCanvas.height = rect.height * dpr;
})();
</script>

</body>
</html>
